<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mini Search Engine</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background:
        linear-gradient(rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.45)),
        url('flowers.jpg') no-repeat center center fixed;
      background-size: cover;
      color: #fff;
      padding: 70px 20px 100px;
    }

    /* Main Container */
    .container {
      width: 100%;
      max-width: 900px;
      margin: auto;
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header h1 {
      margin: 0 0 10px;
      font-size: clamp(28px, 6vw, 48px);
      font-weight: 700;
    }

    .header p {
      margin: 0;
      font-size: clamp(14px, 3vw, 18px);
      opacity: 0.9;
    }

    /* Search Box */
    .search-box {
      display: flex;
      align-items: center;
      width: 100%;
      max-width: 750px;
      margin: 0 auto 30px;
      padding: 6px;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 50px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    }

    .search-box input {
      flex: 1;
      min-width: 0;
      padding: 14px 18px;
      border: none;
      outline: none;
      background: transparent;
      color: #222;
      font-size: 16px;
    }

    .search-box input::placeholder {
      color: #777;
    }

    .search-box button {
      border: none;
      outline: none;
      padding: 13px 24px;
      border-radius: 40px;
      background: #ff4081;

      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.25s ease;
      white-space: nowrap;
    }

    .search-box button:hover {
      background: #e91e63;
      transform: translateY(-1px);
    }

    .search-box button:active {
      transform: scale(0.97);
    }

    /* Results */
    .results {
      width: 100%;
      background: rgba(255, 255, 255, 0.97);
      color: #222;
      padding: 25px;

      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);

      padding: 18px 0;

      border-bottom: none;

</head>

<body>

  <main class="container">

    <header class="header">
      <h1>Mini Search Engine</h1>
      <p>Search the web quickly and easily</p>
    </header>

    <form id="searchForm" class="search-box">

      <input
        type="text"
        id="query"
        name="q"
        placeholder="Search here..."
        autocomplete="off"
        required
      />

      <button type="submit">
        Search
      </button>

    </form>

    <div id="results" class="results"></div>

  </main>


  <script>

    const form = document.getElementById("searchForm");
    const queryInput = document.getElementById("query");
    const resultsDiv = document.getElementById("results");

    form.addEventListener("submit", async (e) => {

      e.preventDefault();

      const query = queryInput.value.trim();

      if (!query) {
        return;
      }

      /* Loading UI */
      resultsDiv.style.display = "block";

      resultsDiv.innerHTML = `
        <div class="loading">
          <div class="spinner"></div>
          Searching...
        </div>
      `;

      try {

        /*
          IMPORTANT:
          Do NOT put your real API key directly
          inside frontend JavaScript.

          This is only an example.
        */

        const response = await fetch(
          `https://api.bing.microsoft.com/v7.0/search?q=${encodeURIComponent(query)}`,
          {
            headers: {
              "Ocp-Apim-Subscription-Key": "YOUR_API_KEY"
            }
          }
        );

        if (!response.ok) {
          throw new Error("Search request failed");
        }

        const data = await response.json();

        resultsDiv.innerHTML = "";

        if (
          data.webPages &&
          data.webPages.value &&
          data.webPages.value.length > 0
        ) {

          data.webPages.value.forEach((item) => {

            const div = document.createElement("div");

            div.className = "result-item";

            const link = document.createElement("a");

            link.href = item.url;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.textContent = item.name;

            const description = document.createElement("p");

            description.textContent = item.snippet || "";

            div.appendChild(link);
            div.appendChild(description);

            resultsDiv.appendChild(div);

          });

        } else {

          resultsDiv.innerHTML = `
            <div class="message">
              No results found.
            </div>
          `;

        }

      } catch (error) {

        console.error(error);

        resultsDiv.innerHTML = `
          <div class="message">
            Something went wrong. Please try again.
          </div>
        `;

      }

    });

  </script>

</body>
</html>
