<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mini Search Engine</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;

      padding: 20px;

      background:
        linear-gradient(
          rgba(0, 0, 0, 0.35),
          rgba(0, 0, 0, 0.5)
        ),
        url("flowers.jpg") center center / cover no-repeat fixed;

      color: white;
    }

    .home-container {
      width: 100%;
      max-width: 800px;
      text-align: center;
    }

    .logo {
      font-size: clamp(32px, 7vw, 55px);
      font-weight: 700;
      margin-bottom: 12px;
    }

    .subtitle {
      font-size: 17px;
      margin-bottom: 30px;
      opacity: 0.9;
    }

    .search-form {
      width: 100%;
      display: flex;
      align-items: center;

      padding: 7px;

      background: rgba(255, 255, 255, 0.96);
      border-radius: 50px;

      box-shadow:
        0 10px 35px rgba(0, 0, 0, 0.3);
    }

    .search-input {
      flex: 1;
      min-width: 0;

      padding: 15px 20px;

      border: none;
      outline: none;

      background: transparent;

      color: #222;
      font-size: 17px;
    }

    .search-input::placeholder {
      color: #777;
    }

    .search-button {
      border: none;
      outline: none;

      padding: 14px 25px;

      border-radius: 40px;

      background: #ff4081;
      color: white;

      font-size: 16px;
      font-weight: 600;

      cursor: pointer;

      transition: 0.25s;
    }

    .search-button:hover {
      background: #e91e63;
      transform: translateY(-1px);
    }

    .search-button:active {
      transform: scale(0.97);
    }

    .footer-text {
      margin-top: 25px;
      font-size: 13px;
      opacity: 0.75;
    }

    /* Mobile */
    @media (max-width: 600px) {

      body {
        padding: 15px;
        background-attachment: scroll;
      }

      .logo {
        font-size: 32px;
      }

      .subtitle {
        font-size: 14px;
        margin-bottom: 22px;
      }

      .search-form {
        flex-direction: column;
        padding: 8px;

        border-radius: 18px;
      }

      .search-input {
        width: 100%;
        padding: 14px;
        font-size: 16px;
      }

      .search-button {
        width: 100%;
        border-radius: 12px;
        padding: 13px;
      }
    }
  </style>
</head>

<body>

  <main class="home-container">

    <div class="logo">
      Mini Search
    </div>

    <div class="subtitle">
      Search the web quickly and easily
    </div>

    <form id="searchForm" class="search-form">

      <input
        type="text"
        id="query"
        class="search-input"
        placeholder="Search the web..."
        autocomplete="off"
        required
      >

      <button type="submit" class="search-button">
        Search
      </button>

    </form>

    <div class="footer-text">
      Mini Search Engine
    </div>

  </main>


  <script>

    const searchForm = document.getElementById("searchForm");
    const queryInput = document.getElementById("query");

    searchForm.addEventListener("submit", function(event) {

      event.preventDefault();

      const query = queryInput.value.trim();

      if (!query) {
        return;
      }

      /*
        Search query URL-এর মাধ্যমে results.html-এ পাঠানো হচ্ছে।

        Example:
        results.html?q=football
      */

      const encodedQuery = encodeURIComponent(query);

      window.location.href = `results.html?q=${encodedQuery}`;

    });

  </script>

</body>
</html>
