<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mini Search Engine</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background: #f4f4f4;
    }
    .search-box {
      display: flex;
      margin-bottom: 20px;
    }
    .search-box input {
      flex: 1;
      padding: 10px;
      font-size: 16px;
    }
    .search-box button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }
    .results {
      background: #fff;
      padding: 20px;
      border-radius: 5px;
    }
    .result-item {
      margin-bottom: 15px;
    }
    .result-item a {
      font-weight: bold;
      color: #0078d7;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <h1>Mini Search Engine</h1>
  <form id="searchForm" class="search-box">
    <input type="text" id="query" name="q" placeholder="Search here..." required />
    <button type="submit">Search</button>
  </form>
  <div id="results" class="results"></div>

  <script>
    const form = document.getElementById('searchForm');
    const resultsDiv = document.getElementById('results');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const query = document.getElementById('query').value;

      // এখানে Bing Search API বা অন্য কোনো সার্চ API ব্যবহার করা যাবে
      const response = await fetch(`https://api.bing.microsoft.com/v7.0/search?q=${encodeURIComponent(query)}`, {
        headers: { 'Ocp-Apim-Subscription-Key': 'YOUR_API_KEY' }
      });
      const data = await response.json();

      resultsDiv.innerHTML = '';
      if (data.webPages && data.webPages.value) {
        data.webPages.value.forEach(item => {
          const div = document.createElement('div');
          div.className = 'result-item';
          div.innerHTML = `<a href="${item.url}" target="_blank">${item.name}</a><p>${item.snippet}</p>`;
          resultsDiv.appendChild(div);
        });
      } else {
        resultsDiv.innerHTML = '<p>No results found.</p>';
      }
    });
  </script>
</body>
</html>
