<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" >
  <title>Search Results - Pipilika Search</title>

  <style>

    /* =========================
       RESET
    ========================= */
    * {
      box-sizing: border-box;
    }
    html {
      scroll-behavior: smooth;
    }
    body {
      margin: 0;
      padding: 0;
      font-family:
        Arial,
        Helvetica,
        sans-serif;
      background: #f5f6f8;
      color: #222222;
      min-height: 100vh;
    }

    /* =========================
       TOP HEADER
    ========================= */

    .top-header {
      position: sticky;
      top: 0;
      z-index: 100;
      width: 100%;
      background: #ffffff;
      border-bottom:
        1px solid #e5e5e5;
      box-shadow:
        0 2px 8px
        rgba(0, 0, 0, 0.05);
    }


    .header-inner {
      width: 100%;
      max-width: 1100px;
      margin: auto;
      padding:
        12px 20px;
      display: flex;
      align-items: center;
      gap: 20px;
    }

    /* =========================
       LOGO
    ========================= */
    .logo {
      flex-shrink: 0;
      color: #ff4081;
      text-decoration: none;
      font-size: 23px;
      font-weight: 700;
      white-space: nowrap;
    }

    .logo:hover {
      color: #e91e63;
    }

    /* =========================
       SEARCH BAR
    ========================= */

    .search-form {
      width: 100%;
      max-width: 700px;
      display: flex;
      align-items: center;
      padding: 4px;
      background: #f1f3f4;
      border:
        1px solid #dddddd;
      border-radius: 30px;
    }

    .search-input {
      flex: 1;
      min-width: 0;
      height: 42px;
      padding:
        0 15px;
      border: none;
      outline: none;
      background: transparent;
      color: #222222;
      font-size: 16px;
    }

    .search-button {
      flex-shrink: 0;
      height: 42px;
      padding:
        0 20px;
      border: none;
      border-radius: 25px;
      background: #ff4081;
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }


    .search-button:hover {
      background: #e91e63;
    }


    /* =========================
       MAIN CONTENT
    ========================= */

    .main-content {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding:
        30px 20px 80px;
    }


    /* =========================
       SEARCH INFO
    ========================= */

    .search-info {
      margin-bottom: 25px;
      color: #666666;
      font-size: 14px;
      line-height: 1.5;
    }

    .search-info strong {
      color: #222222;
    }


    /* =========================
       RESULT CARD
    ========================= */

    .result-item {
      margin-bottom: 15px;
      padding: 20px;
      background: #ffffff;
      border:
        1px solid #e5e5e5;
      border-radius: 10px;
      transition:
        box-shadow 0.2s ease,
        transform 0.2s ease;
    }


    .result-item:hover {
      box-shadow:
        0 6px 20px
        rgba(0, 0, 0, 0.08);
      transform:
        translateY(-1px);
    }


    .result-title {
      display: block;
      margin-bottom: 6px;
      color: #1769aa;
      font-size: 19px;
      font-weight: 600;
      line-height: 1.4;
      text-decoration: none;
      overflow-wrap: anywhere;
    }


    .result-title:hover {
      text-decoration: underline;
    }


    .result-url {
      display: block;
      margin-bottom: 8px;
      color: #188038;
      font-size: 13px;
      overflow-wrap: anywhere;
    }


    .result-description {
      margin: 0;
      color: #555555;
      font-size: 15px;
      line-height: 1.6;
    }

    /* =========================
       LOADING
    ========================= */

    .loading {
      padding:
        70px 20px;
      text-align: center;
      color: #666666;
    }


    .spinner {
      width: 45px;
      height: 45px;
      margin:
        0 auto 15px;
      border:
        4px solid #dddddd;
      border-top-color:
        #ff4081;
      border-radius: 50%;
      animation:
        spin 0.8s linear infinite;
    }


    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }


    /* =========================
       MESSAGE
    ========================= */

    .message {
      padding: 40px 20px;
      background: #ffffff;
      border:
        1px solid #e5e5e5;
      border-radius: 10px;
      text-align: center;
      color: #666666;
      line-height: 1.6;
    }


    /* =========================
       HOME BUTTON
    ========================= */

    .home-button {
      display: inline-block;
      margin-top: 18px;
      padding:
        10px 18px;
      background: #ff4081;
      color: #ffffff;
      border-radius: 25px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }


    .home-button:hover {
      background: #e91e63;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 700px) {
      .header-inner {
        padding:
          10px 12px;
        gap: 10px;
      }


      .logo {
        font-size: 19px;
      }


      .search-input {
        font-size: 15px;
      }


      .search-button {
        padding:
          0 14px;
      }


      .main-content {
        padding:
          22px 12px 60px;
      }


      .result-item {
        padding: 17px;
      }

      .result-title {
        font-size: 17px;

      }

      .result-description {
        font-size: 14px;
      }
    }

    /* =========================
       SMALL MOBILE
    ========================= */

    @media (max-width: 480px) {
      .header-inner {
        display: block;
        padding: 10px;
      }


      .logo {
        display: block;
        margin-bottom: 8px;
        text-align: center;

      }


      .search-form {
        width: 100%;
      }


      .search-input {
        height: 40px;
        padding:
          0 10px;
      }


      .search-button {
        height: 40px;
        padding:
          0 13px;
      }
    }

  </style>
</head>

<body>

  <!-- =========================
       HEADER
  ========================== -->

  <header class="top-header">
    <div class="header-inner">

      <!-- LOGO -->
      <a href="index.html"
        class="logo" >
        Pipilika Search
      </a>

      <!-- SEARCH FORM -->
      <form
        id="searchForm"
        class="search-form" 
        >
        
        <input
          type="text"
          id="searchInput"
          class="search-input"
          placeholder="Search the web..."
          autocomplete="off"
          required 
          >

        <button
          type="submit"
          class="search-button"
        >
          Search
        </button>
      </form>

    </div>
  </header>

  <!-- =========================
       MAIN
  ========================== -->

  <main class="main-content">

    <!-- SEARCH INFORMATION -->

    <div
      id="searchInfo"
      class="search-info"
    ></div>

    <!-- RESULTS -->

    <div id="results">
      <div class="loading">
        <div class="spinner"></div>
        <div>
          Loading results...
        </div>
      </div>
    </div>

  </main>

  <script>

    /* =========================
       ELEMENTS
    ========================= */

    const searchForm =
      document.getElementById(
        "searchForm"
      );

    const searchInput =
      document.getElementById(
        "searchInput"
      );

    const searchInfo =
      document.getElementById(
        "searchInfo"
      );

    const resultsDiv =
      document.getElementById(
        "results"
      );

    /* =========================
       GET QUERY FROM URL
    ========================= */

    const urlParams =
      new URLSearchParams(
        window.location.search
      );

    const query =
      urlParams.get("q");

    /* =========================
       START
    ========================= */

    if (!query) {
      showMessage(
        "No search query was provided."
      );
    } else {
      searchInput.value = query;
      searchInfo.innerHTML =
        `Search results for
        <strong>"${escapeHTML(query)}"</strong>`;
      startSearch(query);

    }

    /* =========================
       SEARCH
    ========================= */

    function startSearch(query) {
      /* Loading animation */

      resultsDiv.innerHTML = `
        <div class="loading">
          <div class="spinner"></div>
          <div>
            Searching for
            <strong>
              ${escapeHTML(query)}
            </strong>
          </div>
        </div>
      `;

      /* 
       এখন API নেই। তাই 1.5 second delay-এর পর
       Demo results দেখানো হচ্ছে।
      */
      setTimeout(
        function () {
          showDemoResults(query);
        },
        1500
      );
    }

    /* =========================
       DEMO RESULTS
    ========================= */

    function showDemoResults(query) {
      const demoResults = [

        {
          title:
            `About ${query} - Pipilika Search`,

          url:
            "https://example.com",
          description:
            `This is a demo search result for "${query}". Your real search API will be connected here later.`
        },

        {
          title:
            `Learn more about ${query}`,
          url:
            "https://example.com",
          description:
            "This is another demonstration result. Once the API is connected, real web results will appear here."
        },

        {
          title:
            `Search information for ${query}`,
          url:
            "https://example.com",
          description:
            "Pipilika Search is currently running in demo mode. The search engine API can be added later."
        }

      ];

      renderResults(
        demoResults
      );
    }

    /* =========================
       RENDER RESULTS
    ========================= */

    function renderResults(results) {

      resultsDiv.innerHTML = "";

      results.forEach(
        function (item) {

          const result =
            document.createElement(
              "article"
            );

          result.className =
            "result-item";

          /* TITLE */

          const title =
            document.createElement(
              "a"
            );

          title.className =
            "result-title";

          title.href =
            item.url;

          title.target =
            "_blank";

          title.rel =
            "noopener noreferrer";

          title.textContent =
            item.title;

          /* URL */
          const url =
            document.createElement(
              "span"
            );

          url.className =
            "result-url";

          url.textContent =
            item.url;

          /* DESCRIPTION */
          const description =
            document.createElement(
              "p"
            );

          description.className =
            "result-description";

          description.textContent =
            item.description;

          /* ADD */

          result.appendChild(
            title
          );

          result.appendChild(
            url
          );

          result.appendChild(
            description
          );

          resultsDiv.appendChild(
            result
          );
        }
      );
    }

    /* =========================
       NEW SEARCH
    ========================= */

    searchForm.addEventListener(
      "submit",
      function (event) {
        event.preventDefault();

        const newQuery =
          searchInput.value.trim();

        if (!newQuery) {
          searchInput.focus();
          return;
        }

        const encodedQuery =
          encodeURIComponent(
            newQuery
          );


        /* New search করলে
          নতুন URL তৈরি হবে। */
        window.location.href =
          "results.html?q=" +
          encodedQuery;
      }
    );


    /* =========================
       MESSAGE
    ========================= */

    function showMessage(message) {
      resultsDiv.innerHTML = `
        <div class="message">
          ${escapeHTML(message)}

          <br>
          <a
            href="index.html"
            class="home-button"
          >
            Back to Home
          </a>
        </div>
      `;
    }


    /* =========================
       HTML ESCAPE
    ========================= */

    function escapeHTML(value) {
      return String(value)
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );
    }

  </script>
 </body>
</html>
